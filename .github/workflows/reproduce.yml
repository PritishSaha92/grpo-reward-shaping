name: CPU reproduction
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/test_compare_outputs.py
      - run: python scripts/verify_repository.py
      - run: python scripts/reproduce.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-${{ matrix.os }}
          path: |
            reproduced/verification.json
            reproduced/logs/
